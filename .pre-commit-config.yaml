# Install once: uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  # Must run before check-json: PowerShell-generated .kiro JSON carries a BOM that check-json rejects.
  - repo: local
    hooks:
      - id: kiro-json-encoding
        name: normalise .kiro JSON encoding (strip BOM)
        entry: python3 scripts/fix_hook_encoding.py
        language: system
        pass_filenames: false
        files: ^\.kiro/(hooks|settings)/.*\.json$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        types: [python]
      - id: conventional-commit
        name: conventional commit message
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
